<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="This SoftBazzar page could not be found. Return to the store to browse available products." />
    <meta name="theme-color" content="#0b0b0d" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Page not found | SoftBazzar</title>
    <style>
      /* Hallmark · checked: 2026-11-02 · genre: modern-minimal (inferred) */
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        --page: #0b0b0d;
        --ink: #f3f4f6;
        --surface: rgba(31, 32, 40, .88);
        --edge: rgba(255, 255, 255, .12);
        --muted: #c4c0cb;
        --accent: #a855f7;
        --accent-light: #c084fc;
        --accent-ink: #10091a;
        --focus: #fcd34d;
        --glow: rgba(168, 85, 247, .12);
        background: var(--page);
        color: var(--ink);
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * { box-sizing: border-box; }
      html, body { overflow-x: clip; }

      body {
        display: grid;
        min-height: 100svh;
        margin: 0;
        padding: clamp(20px, 5vw, 48px);
        place-items: center;
        background: radial-gradient(ellipse at 50% 35%, var(--glow), transparent 48%), var(--page);
      }

      main {
        width: min(100%, 560px);
        padding: clamp(28px, 7vw, 56px);
        border: 1px solid var(--edge);
        border-radius: 24px;
        background: var(--surface);
        text-align: center;
      }

      a.brand {
        display: inline-block;
        margin-bottom: 40px;
        color: var(--ink);
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -.03em;
        text-decoration: none;
      }

      h1 {
        margin: 0;
        font-size: clamp(32px, 8vw, 44px);
        line-height: 1.12;
        letter-spacing: -.04em;
        text-wrap: balance;
      }

      .message {
        margin: 16px 0 28px;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.6;
      }

      .home {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        padding: 0 20px;
        border-radius: 12px;
        background: var(--accent);
        color: var(--accent-ink);
        font-size: 15px;
        font-weight: 700;
        text-decoration: none;
      }

      .home:hover { background: var(--accent-light); }
      .home:active { background: var(--accent-light); transform: translateY(1px); }
      a:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/" aria-label="SoftBazzar home">SoftBazzar</a>
      <h1>That page isn’t here.</h1>
      <p class="message">The link may be old, or the address may be mistyped.</p>
      <a class="home" href="/">Back to SoftBazzar</a>
    </main>
  </body>
</html>
