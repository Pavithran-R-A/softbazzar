name: Apply storefront hardening

on:
  push:
    branches: ["hardening/20260829"]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[hardening-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/20260829
      - name: Apply audited source transforms
        run: python3 scripts/apply-storefront-hardening.py
      - name: Commit transformed storefront
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: apply storefront hardening [hardening-applied]"
          git push origin HEAD:hardening/20260829
