name: Refresh dependency lockfile

on:
  push:
    branches: ["hardening/**"]

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[lockfile-refreshed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate current lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify dependency audit
        run: npm audit --audit-level=high
      - name: Commit current lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh secure dependency lockfile [lockfile-refreshed]"
          git push origin HEAD:${{ github.ref_name }}
