name: CI

on:
  push:
    branches: ["main", "hardening/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm install
      - name: High-severity dependency audit
        run: npm audit --audit-level=high
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
