name: CI

on:
  push:
    branches: ["main", "hardening/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: High-severity dependency audit
        run: npm audit --audit-level=high
      - name: Tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser regressions
        run: npm run test:browser
      - name: Build Cloudflare Pages staging bundle
        run: npm run build:pages:staging
      - name: Save tested Pages deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: softbazzar-pages-dist
          path: dist/
          retention-days: 2
